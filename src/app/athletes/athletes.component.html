<div class="container mt-4">
  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Id</th>
            <th>Nom</th>
            <th>Nationalité</th>
            <th>Sport</th>
            <th>Date Naissance</th>
          </tr>
        </thead>
        <tbody>
          @for (athlete of athletes; track athlete.idAthlete) {
            <tr>
              <td>{{athlete.idAthlete}}</td>
              <td>{{athlete.nomComplet}}</td>
              <td>{{athlete.nationalite}}</td>
              <td>{{athlete.sport}}</td>
              <td>{{athlete.dateNaissance | date:'dd/MM/yyyy'}}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5" class="text-center text-danger fw-bold">Aucun athlète trouvé !</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
