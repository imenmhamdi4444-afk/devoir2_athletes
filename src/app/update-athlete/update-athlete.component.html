<div class="container mt-4">
  <div class="card shadow mb-4">
    <div class="card-body">
      <h2>Modifier un Athlète :</h2>
      <form>
        <div class="col-sm-2 col-md-2 col-lg-2 mb-3">
          <label class="form-label">ID Athlète</label>
          <input readonly type="text" [(ngModel)]="currentAthlete.idAthlete" name="idAthlete" class="form-control">
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
          <label class="form-label">Nom Complet</label>
          <input type="text" [(ngModel)]="currentAthlete.nomComplet" name="nomComplet" class="form-control">
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
          <label class="form-label">Nationalité</label>
          <input type="text" [(ngModel)]="currentAthlete.nationalite" name="nationalite" class="form-control">
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
          <label class="form-label">Sport</label>
          <input type="text" [(ngModel)]="currentAthlete.sport" name="sport" class="form-control">
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
          <label class="form-label">Date de Naissance</label>
          <input type="date" [ngModel]="currentAthlete.dateNaissance | date:'yyyy-MM-dd'"
            (ngModelChange)="currentAthlete.dateNaissance = $event" name="dateNaissance" class="form-control">
        </div>

        <div class="mt-3">
          <button type="button" (click)="updateAthlete()" class="btn btn-success">Modifier</button>
        </div>
      </form>
    </div>
  </div>
</div>
