<div class="container mt-4">
  <div class="card shadow mb-4">
    <div class="card-body">
      <h2>Ajouter un Athlète :</h2>
      <form>
        <div class="col-sm-2 col-md-2 col-lg-2 mb-3">
          <label class="form-label">ID Athlète</label>
          <input type="number" [(ngModel)]="newAthlete.idAthlete" name="idAthlete" class="form-control">
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
          <label class="form-label">Nom Complet</label>
          <input type="text" [(ngModel)]="newAthlete.nomComplet" name="nomComplet" class="form-control">
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
          <label class="form-label">Nationalité</label>
          <input type="text" [(ngModel)]="newAthlete.nationalite" name="nationalite" class="form-control">
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
          <label class="form-label">Sport</label>
          <input type="text" [(ngModel)]="newAthlete.sport" name="sport" class="form-control">
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
          <label class="form-label">Date de Naissance</label>
          <input type="date" [(ngModel)]="newAthlete.dateNaissance" name="dateNaissance" class="form-control">
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
          <label class="form-label">Équipe</label>
          <select class="form-control form-control-lg" id="codeEquipe" name="codeEquipe" [(ngModel)]="newCodeEquipe">
            <option [value]="0">-- Sans équipe (Individuel) --</option>
            @for (eq of equipes; track eq.codeEquipe) {
              <option [value]="eq.codeEquipe">{{eq.nomEquipe}}</option>
            }
          </select>
        </div>

        <div class="mt-3">
          <button type="button" (click)="addAthlete()" class="btn btn-success">Ajouter</button>
        </div>
      </form>
    </div>
  </div>
</div>
